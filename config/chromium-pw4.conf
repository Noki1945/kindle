# Chromium flags for the separate, optional PW4 engine image.
CHROMIUM_FLAGS="$CHROMIUM_FLAGS
  --no-sandbox --test-type
  --no-first-run --no-default-browser-check --disable-sync --hide-crash-restore-bubble
  --password-store=basic
  --force-device-scale-factor=${KBROWSER_SCALE:-2}
  --top-chrome-touch-ui=enabled --touch-events=enabled
  --disable-smooth-scrolling --disable-gpu --disable-gpu-compositing --in-process-gpu
  --renderer-process-limit=${KBROWSER_RENDERERS:-1} --process-per-site
  --disk-cache-size=33554432 --media-cache-size=8388608
  --autoplay-policy=user-gesture-required --disable-component-update
  --disable-features=DisableLoadExtensionCommandLineSwitch,MediaRouter,OptimizationHints,Translate,BackForwardCache,NetworkServiceSandbox
  --enable-features=OverlayScrollbar,NetworkServiceInProcess2
  --load-extension=/opt/kbrowser/touchkit
  --enable-low-end-device-mode
"

# Marker contains no credentials. SOCKS5 resolves website names at the proxy.
# No direct fallback is configured if the local proxy stops.
if [ -f /mnt/us/kindle-lite/vpn.enabled ]; then
  CHROMIUM_FLAGS="$CHROMIUM_FLAGS --proxy-server=socks5://127.0.0.1:10808 --disable-quic --dns-prefetch-disable"
fi
